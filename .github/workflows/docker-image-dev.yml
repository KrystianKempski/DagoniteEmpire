name: Create and publish dev Docker image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV

      - name: Checkout DagoniteEmpire
        uses: actions/checkout@v4
        with:
          path: empire

      - name: Checkout dagonite-wiki
        uses: actions/checkout@v4
        with:
          repository: KrystianKempski/dagonite-wiki
          ref: main
          token: ${{ secrets.WIKI_REPO_TOKEN }}
          path: dagonite-wiki

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dagonite-wiki/package-lock.json

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Build wiki
        working-directory: empire/tools/Scripts
        run: |
          chmod +x build_wiki_for_empire.sh deploy_wiki_to_wwwroot.sh
          ./build_wiki_for_empire.sh

      - name: Verify wiki output
        run: |
          test -f empire/DagoniteEmpire/wwwroot/wiki/index.html
          test -f empire/DagoniteEmpire/wwwroot/wiki/static/wiki-access.json
          test -f empire/DagoniteEmpire/wwwroot/wiki/.wiki-build-info.json
          cat empire/DagoniteEmpire/wwwroot/wiki/.wiki-build-info.json

      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            prefix=dev.${{ env.NOW }}-
            suffix=

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5.1.0
        with:
          context: empire
          file: empire/DagoniteEmpire/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
