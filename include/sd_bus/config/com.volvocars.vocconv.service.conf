<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="tcam">
    <allow own="com.volvocars.vocconv.Service"/>
  </policy>
  <policy group="pd_app">
    <allow send_destination="com.volvocars.vocconv.Service"/>
    <allow receive_sender="com.volvocars.vocconv.Service"/>
  </policy>
  <policy user="root">
    <allow own="com.volvocars.vocconv.Service"/>
    <allow own_prefix="com.volvocars.vocconv.Service"/>
    <allow send_destination="com.volvocars.vocconv.Service"/>
    <allow receive_sender="com.volvocars.vocconv.Service"/>
  </policy>
  <policy context="default">
    <deny own_prefix="com.volvocars.vocconv.Service"/>
    <deny send_destination="com.volvocars.vocconv.Service"/>
  </policy>
</busconfig>
