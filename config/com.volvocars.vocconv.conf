<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- This configuration file specifies the required security policies
       for VocConv diagnosis plugin. -->
  <!-- These DBUS interfaces are exclusively used for diagnostics
       in VocConv. -->

  <policy user="tcam">
        <allow own="com.volvocars.vocconv"/>
  </policy>
  <policy user="root">
        <allow own="com.volvocars.vocconv"/>
        <allow send_destination="com.volvocars.vocconv"/>
        <allow receive_sender="com.volvocars.vocconv"/>
  </policy>
  <policy group="pd_app">
        <allow send_destination="com.volvocars.vocconv"/>
        <allow receive_sender="com.volvocars.vocconv"/>
  </policy>

</busconfig>
